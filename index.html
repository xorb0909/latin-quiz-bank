    { id:8,q:"다음 중 맞는 것을 모두 고르세요",stmts:["불레리아스, 판당고스, 말라게냐스 등은 플라멩고와 구별되는 독자적인 전통을 수립해왔다","스페인의 의회제도는 양원제이며 상원이 하원에 비해 우월한 지위를 부여받고 있다","스페인 내전은 프랑코 군대가 바르셀로나를 함락시키면서 막을 내렸고 곧이어 영국이 프랑코 정권을 승인했다","스페인은 신대륙을 원활히 통치하기 위한 최고기관으로 중남미 위원회를 설치하였다","올리브유에 대한 스페인인들의 선호는 로마 음식문화의 영향이다","스페인 와인 최고등급은 Vino de Pago는 유럽최고의 권위를 가지는 역사적인 등급체계다","스페인의 공식언어는 카스티야어, 카탈루냐어, 바스크어, 갈리시아어 등 4가지다","세비야 성당과 알카사르 성은 같은 양식으로 지어진 건축물이다"],opts:["3,4,5,6","1,2,4,5,8","2,8","5,7,8","1,3,6,7"],ans:0,tags:["플라멩코","정치","내전","통치","음식","와인","언어","건축"],explain:"1)✗ 플라멩코의 변형들\n2)✗ 하원 우월\n3)○ 1939 바르셀로나\n4)○ 인디아스 위원회 (이름이 비슷)\n5)○ 로마 영향 (교안1 p15)\n6)○ 최고등급 (교안1 p16)\n7)○ 4개 공용어\n8)✗ 세비야=고딕, 알카사르=무데하르 — 출제 정답 ①" },
    { id:9,q:"다음 중 맞는 것을 모두 고르세요",stmts:["스페인 제국 탄생의 기반이 된 왕국은 카스티야 왕국과 아라곤 왕국 그리고 아스투리아스 왕국이다","코르도바의 메스키타는 이중아치 구조로 되어 있어 천고가 높아 보이는 효과를 가지고 있다","하몬은 스페인인들의 정체성의 한 표현이다","오리지널 플라멩코 무용은 사파테아도, 팔마, 피트 그리고 칸테로 구성되었다","중남미 지역은 언어적 공통성으로 인해 사회통합이 용이한 측면을 가지고 있다","인민 전선 정부의 주축 세력은 스탈린주의를 추종하는 공산주의자들이었다","볼리비아는 내륙국의 한계를 극복하기 위한 상징적 행위로 해군을 운용하고 있다","칠레에서는 친미독재정권을 전복하기 위한 사회주의 혁명이 발생했다"],opts:["1,2,5,6,8","2,3,4,7,8","1,2,3,4,5,7","2,3,7","2,7,8"],ans:3,tags:["스페인왕조","이슬람","음식","플라멩코","내전","중남미국가"],explain:"1)✗ 카스티야+아라곤\n2)○ 이중아치 (교안1 p10)\n3)○ 정체성 (교안1 p15)\n4)✗ 칸테는 노래\n5)✗ 혼종성=다양\n6)✗ 사회주의자\n7)○ 티티카카 해군\n8)✗ 칠레는 우파 군부 — 출제 정답 ④ 2,3,7" },
    { id:10,q:"다음 중 맞는 것을 모두 고르세요",stmts:["스페인 내각은 주로 전문가들이 장관으로 임명되어 업무 효율성이 높다는 장점을 가지고 있다","태양의 돌은 아즈텍인들의 우주관을 잘 보여주고 있는 역사적 유물이다","잉카인들이 가장 사랑하였던 신은 케찰코아틀신이다","구엘 공원은 원래 고급 주택지로 조성되었다","알타미라 동굴 벽화는 고대부터 스페인 거주민들이 소와 밀접한 관련을 맺고 있음을 보여준다","스페인 내전 당시 미국은 공화파와 프랑코파 모두를 대상으로 군수사업을 하였다","칠레에서 있었던 지하철 요금 인상으로 인한 시위는 칠레 사회의 인종적 갈등이 팽배해 있음을 보여준다","세계적 의류기업인 ZARA는 다양한 브랜드를 통해 보다 많은 소비자들을 확보하는 전략을 취하고 있다"],opts:["2,4,5,6","1,3,4,5,6,7,8","1,6,7","3,5,7","1,2,7,8"],ans:0,tags:["정치","아즈텍","잉카","건축","문화","내전","칠레","ZARA"],explain:"1)✗ 정치인 장관\n2)○ 아즈텍 (교안2)\n3)✗ 케찰코아틀=아즈텍\n4)○ 구엘공원 (교안1 p13)\n5)○ 알타미라 (교안1 p1)\n6)○ 미국 군수\n7)✗ 빈부격차\n8)○ Inditex" },

function QuestionCard({ q, answered, onSelect }) {
  const done = answered[q._key] !== undefined;
  const userAns = answered[q._key];

  if (q.kind === "essay") {
    return <EssayCard q={q} answered={answered} onSelect={onSelect}/>;
  }

  const correctSet = q.ansSet || [];
  const isCorrect = done && userAns === q.ans;

  return (
    <div style={{ background:C.card, borderRadius:12, padding:20, marginTop:16, border:`1px solid ${C.border}` }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, alignItems:"flex-start", gap:8 }}>
        <span style={{ color:C.accent, fontWeight:800, whiteSpace:"nowrap" }}>{q._examShort} · Q{q.id}</span>
        <div style={{ textAlign:"right" }}>{(q.tags||[]).map(t=><span key={t} style={{ display:"inline-block",fontSize:11,padding:"3px 8px",borderRadius:10,background:"#ff5a7322",color:C.accent,marginLeft:3,marginBottom:3,fontWeight:600 }}>{t}</span>)}</div>
      </div>
      <div style={{ fontSize:16, fontWeight:700, margin:"12px 0", lineHeight:1.55, whiteSpace:"pre-wrap", color:C.text }}>{q.q}</div>
      <div style={{ marginBottom:12 }}>
        {q.stmts.map((s,i)=>{
          const num=i+1; const isR=correctSet.includes(num);
          let col = done ? (isR?C.correct:C.wrong) : C.text;
          return <div key={i} style={{ fontSize:14, color:col, padding:"6px 0", lineHeight:1.65, textDecoration:done&&!isR?"line-through":"none", opacity:done&&!isR?0.7:1, fontWeight:done&&isR?600:400 }}>{num}) {s}</div>;
        })}
      </div>
      {q.kind === "multi" ? (
        <MultiSelectButtons q={q} done={done} userAns={userAns} onSelect={onSelect}/>
      ) : (
        q.opts.map((opt,i)=>{
          const isC=done&&i===q.ans;
          const isW=done&&i===userAns&&userAns!==q.ans;
          return <button key={i} style={{ display:"block",width:"100%",padding:"12px 14px",marginTop:6,border:`1px solid ${isC?C.correct:isW?C.wrong:C.border}`,borderRadius:8,background:isC?"#2ee5b133":isW?"#ff6b8533":"#0d1117",color:isC?C.correct:isW?C.wrong:C.text,fontSize:14,fontWeight:isC||isW?700:500,cursor:done?"default":"pointer",textAlign:"left",outline:"none",lineHeight:1.5 }} onClick={()=>!done&&onSelect(q._key,i)}>{CIRC[i]} {opt}{isC?" ✓":""}{isW?" ✗":""}</button>;
        })
      )}
      {done&&<div style={{ marginTop:16,padding:16,background:"#161624",borderRadius:8,border:`1px solid ${C.border}`,fontSize:13.5,lineHeight:1.85,color:C.dim,whiteSpace:"pre-wrap" }}>
        <div style={{ fontWeight:700,color:isCorrect?C.correct:C.wrong,marginBottom:10,fontSize:14 }}>{isCorrect?"✅ 정답!":q.kind==="multi"?"❌ 오답":"❌ 오답 — 정답: "+CIRC[q.ans]+" "+(q.opts?q.opts[q.ans]:"")}</div>
        {q.explain}
      </div>}
    </div>
  );
}

function MultiSelectButtons({ q, done, userAns, onSelect }) {
  const [picked, setPicked] = useState([]);
  const correctSet = q.ansSet || [];

  if (done) {
    return (
      <div style={{ marginTop:10 }}>
        <div style={{ fontSize:13, color:C.text, marginBottom:6 }}>내가 고른 답: <span style={{ fontWeight:700 }}>{(userAns||[]).map(n=>n).join(", ")||"(없음)"}</span></div>
        <div style={{ fontSize:13, color:C.correct, marginBottom:6, fontWeight:700 }}>정답: {correctSet.join(", ")}</div>
      </div>
    );
  }

  const toggle = (n) => setPicked(p => p.includes(n)?p.filter(x=>x!==n):[...p,n].sort((a,b)=>a-b));
  const submit = () => onSelect(q._key, picked);

  return (
    <div style={{ marginTop:10 }}>
      <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:12 }}>
        {q.stmts.map((_,i)=>{
          const n=i+1; const on=picked.includes(n);
          return <button key={i} onClick={()=>toggle(n)} style={{ padding:"8px 14px",borderRadius:18,border:`1px solid ${on?C.accent:C.border}`,background:on?"#ff5a7344":"#0d1117",color:on?C.text:C.text,fontSize:14,fontWeight:on?700:500,cursor:"pointer",outline:"none",minWidth:42 }}>{n}</button>;
        })}
      </div>
      <button onClick={submit} disabled={picked.length===0} style={{ width:"100%",padding:"12px",borderRadius:8,border:"none",background:picked.length?C.accent:C.border,color:"#fff",fontSize:14,fontWeight:700,cursor:picked.length?"pointer":"default",outline:"none" }}>제출 ({picked.length}개)</button>
    </div>
  );
}

function EssayCard({ q, answered, onSelect }) {
  const done = answered[q._key] !== undefined;
  const userMark = answered[q._key];
  const [reveal, setReveal] = useState(false);
  const [input, setInput] = useState("");

  return (
    <div style={{ background:C.card, borderRadius:12, padding:20, marginTop:16, border:`1px solid ${C.border}` }}>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, alignItems:"flex-start", gap:8 }}>
        <span style={{ color:C.accent, fontWeight:800 }}>{q._examShort} · Q{q.id} <span style={{ color:C.gold }}>[{q.type==="short"?"단답":"서술"}]</span></span>
        <div style={{ textAlign:"right" }}>{(q.tags||[]).map(t=><span key={t} style={{ display:"inline-block",fontSize:11,padding:"3px 8px",borderRadius:10,background:"#ff5a7322",color:C.accent,marginLeft:3,marginBottom:3,fontWeight:600 }}>{t}</span>)}</div>
      </div>
      <div style={{ fontSize:16, fontWeight:700, margin:"12px 0", lineHeight:1.55, whiteSpace:"pre-wrap", color:C.text }}>{q.q}</div>
      <textarea
        value={input}
        onChange={e=>setInput(e.target.value)}
        placeholder="답을 입력해보세요 (자동 채점은 안 됩니다)"
        style={{ width:"100%",minHeight:q.type==="short"?70:140,padding:12,borderRadius:8,border:`1px solid ${C.border}`,background:"#0d1117",color:C.text,fontSize:14,fontFamily:"inherit",resize:"vertical",outline:"none",lineHeight:1.6 }}
        disabled={done}
      />
      {!reveal && !done && (
        <button onClick={()=>setReveal(true)} style={{ marginTop:10,width:"100%",padding:"10px",borderRadius:8,border:`1px solid ${C.gold}`,background:"transparent",color:C.gold,fontSize:13,fontWeight:700,cursor:"pointer",outline:"none" }}>모범답안 보기</button>
      )}
      {reveal && (
        <div style={{ marginTop:12,padding:14,background:"#0d1117",borderRadius:8,border:`1px solid ${C.gold}`,fontSize:12.5,lineHeight:1.8,color:C.text,whiteSpace:"pre-wrap" }}>
          <div style={{ fontWeight:700,color:C.gold,marginBottom:8 }}>📖 모범답안</div>
          {q.answer}
        </div>
      )}
      {reveal && !done && (
        <div style={{ display:"flex", gap:8, marginTop:10 }}>
          <button onClick={()=>onSelect(q._key,"correct")} style={{ flex:1,padding:"10px",borderRadius:8,border:`1px solid ${C.correct}`,background:"transparent",color:C.correct,fontSize:13,fontWeight:700,cursor:"pointer",outline:"none" }}>✅ 맞았어요</button>
          <button onClick={()=>onSelect(q._key,"wrong")} style={{ flex:1,padding:"10px",borderRadius:8,border:`1px solid ${C.wrong}`,background:"transparent",color:C.wrong,fontSize:13,fontWeight:700,cursor:"pointer",outline:"none" }}>❌ 틀렸어요</button>
        </div>
      )}
      {done && (
        <div style={{ marginTop:10,padding:10,background:userMark==="correct"?"#00b89422":"#e9456022",borderRadius:8,textAlign:"center",fontSize:12.5,fontWeight:700,color:userMark==="correct"?C.correct:C.wrong }}>
          {userMark==="correct"?"✅ 정답으로 표시":"❌ 오답으로 표시"}
        </div>
      )}
    </div>
  );
}

// 답안 데이터를 키 포함 형태로 정규화
function normalize(exam) {
  return exam.questions.map(q => {
    const key = `${exam.id}-${q.id}`;
    let ansSet = q.ansSet;
    if (!ansSet && exam.kind!=="essay" && q.opts) {
      // opt 문자열에서 정답 번호 추출 (예: "1,3,4" → [1,3,4])
      const correctOptStr = q.opts[q.ans] || "";
      ansSet = correctOptStr.replace(/[^0-9,]/g,"").split(",").filter(Boolean).map(Number);
    }
    return { ...q, _key:key, _examId:exam.id, _examShort:exam.short, _examTitle:exam.title, ansSet, kind:exam.kind==="multi"?"multi":(exam.kind==="essay"?"essay":"choice") };
  });
}

function ExamHome({ exams, allTags, onPickExam, onPickTag, answered, onReset }) {
  const [view, setView] = useState("exam"); // exam | tag

  const stats = useMemo(() => {
    let c=0, w=0, total=0;
    exams.forEach(e => e._qs.forEach(q => {
      total++;
      const a = answered[q._key];
      if (a===undefined) return;
      if (q.kind==="essay") { if(a==="correct") c++; else w++; }
      else if (q.kind==="multi") {
        const set = q.ansSet||[];
        const sameSet = Array.isArray(a) && a.length===set.length && a.every(x=>set.includes(x));
        if(sameSet) c++; else w++;
      }
      else { if(a===q.ans) c++; else w++; }
    }));
    return { c, w, total, done:c+w };
  }, [exams, answered]);

  return (
    <div style={{ padding:"24px 16px", maxWidth:720, margin:"0 auto" }}>
      <div style={{ textAlign:"center", padding:"20px 0 24px" }}>
        <div style={{ fontSize:30, fontWeight:900, color:C.gold }}>📋 라틴아메리카</div>
        <div style={{ fontSize:14, color:C.dim, marginTop:8 }}>문화와 예술 · 기출 문제은행</div>
        <div style={{ marginTop:16, padding:"12px 18px", background:C.card, borderRadius:10, border:`1px solid ${C.border}`, display:"inline-block" }}>
          <span style={{ color:C.correct, fontWeight:700, fontSize:14 }}>✓ {stats.c}</span>
          <span style={{ color:C.subtle, margin:"0 10px" }}>·</span>
          <span style={{ color:C.wrong, fontWeight:700, fontSize:14 }}>✗ {stats.w}</span>
          <span style={{ color:C.subtle, margin:"0 10px" }}>·</span>
          <span style={{ color:C.dim, fontSize:14 }}>전체 {stats.total}</span>
        </div>
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        <button onClick={()=>setView("exam")} style={{ flex:1,padding:"14px",borderRadius:10,border:`1px solid ${view==="exam"?C.accent:C.border}`,background:view==="exam"?"#ff5a7333":C.card,color:view==="exam"?C.text:C.dim,fontSize:14,fontWeight:700,cursor:"pointer",outline:"none" }}>📚 족보별</button>
        <button onClick={()=>setView("tag")} style={{ flex:1,padding:"14px",borderRadius:10,border:`1px solid ${view==="tag"?C.accent:C.border}`,background:view==="tag"?"#ff5a7333":C.card,color:view==="tag"?C.text:C.dim,fontSize:14,fontWeight:700,cursor:"pointer",outline:"none" }}>🏷️ 카테고리별</button>
      </div>

      {view==="exam" ? (
        exams.map(e=>{
          const eStats = e._qs.reduce((acc,q)=>{
            const a = answered[q._key];
            if(a===undefined) return acc;
            const ok = q.kind==="essay" ? a==="correct"
                   : q.kind==="multi" ? (Array.isArray(a) && a.length===(q.ansSet||[]).length && a.every(x=>(q.ansSet||[]).includes(x)))
                   : a===q.ans;
            return { c:acc.c+(ok?1:0), w:acc.w+(ok?0:1), done:acc.done+1 };
          }, {c:0,w:0,done:0});
          return (
            <button key={e.id} onClick={()=>onPickExam(e.id)} style={{ display:"block",width:"100%",padding:"18px 20px",marginTop:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,color:C.text,fontSize:16,fontWeight:700,cursor:"pointer",textAlign:"left",outline:"none" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ color:C.text }}>{e.title}</span>
                {eStats.done>0 && <span style={{ fontSize:12, color:C.dim }}>{eStats.done}/{e._qs.length} <span style={{ color:C.correct, fontWeight:700 }}>✓{eStats.c}</span> <span style={{ color:C.wrong, fontWeight:700 }}>✗{eStats.w}</span></span>}
              </div>
              <div style={{ fontSize:13, color:C.dim, marginTop:6, fontWeight:500 }}>{e._qs.length}문제 · {e.kind==="essay"?"단답/서술형":e.kind==="multi"?"다중선택":"5지선다"}</div>
            </button>
          );
        })
      ) : (
        <div>
          <div style={{ fontSize:13, color:C.dim, marginBottom:12, textAlign:"center" }}>족보 전체 통합 · 같은 주제로 모은 문제들</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {allTags.map(t=>(
              <button key={t.tag} onClick={()=>onPickTag(t.tag)} style={{ padding:"11px 16px",borderRadius:20,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:14,fontWeight:600,cursor:"pointer",outline:"none" }}>
                {t.tag} <span style={{ color:C.gold, fontWeight:700 }}>({t.count})</span>
              </button>
            ))}
          </div>
        </div>
      )}

      <button onClick={onReset} style={{ display:"block",margin:"32px auto 16px",padding:"8px 18px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.dim,fontSize:11.5,cursor:"pointer",outline:"none" }}>풀이 기록 모두 초기화</button>
      <div style={{ textAlign:"center", fontSize:10.5, color:C.dim, marginTop:8 }}>로컬에 저장되어 새로고침해도 유지됩니다</div>
    </div>
  );
}

function QuizView({ title, questions, examKind, answered, onSelect, onClearKeys, onBack }) {
  const [mode, setMode] = useState("all");
  const [idx, setIdx] = useState(0);
  const [retryKeys, setRetryKeys] = useState(null); // null=not in retry mode, array=fixed retry list

  const isWrong = (q, a) => {
    if (a===undefined) return false;
    if (q.kind==="essay") return a==="wrong";
    if (q.kind==="multi") { const s=q.ansSet||[]; return !(Array.isArray(a)&&a.length===s.length&&a.every(x=>s.includes(x))); }
    return a!==q.ans;
  };

  const filtered = useMemo(() => {
    if (mode==="wrong") {
      // 오답 다시풀기: 모드 진입 시 캡처된 키들만 보여주기 (답안은 이미 리셋됨)
      if (retryKeys) return questions.filter(q => retryKeys.includes(q._key));
      // 아직 캡처 전: 현재 오답인 것들
      return questions.filter(q => isWrong(q, answered[q._key]));
    }
    if (mode==="unanswered") return questions.filter(q=>answered[q._key]===undefined);
    return questions;
  }, [mode, answered, questions, retryKeys]);

  const handleModeChange = (newMode) => {
    if (newMode === "wrong") {
      // 현재 오답인 문제들을 캡처 → 그 답안만 리셋 → 다시 풀이 가능 상태
      const wrongList = questions.filter(q => isWrong(q, answered[q._key]));
      const keys = wrongList.map(q => q._key);
      setRetryKeys(keys);
      if (keys.length > 0) onClearKeys(keys);
    } else {
      setRetryKeys(null);
    }
    setMode(newMode);
    setIdx(0);
  };

  const stats = useMemo(() => {
    let c=0, w=0;
    questions.forEach(q=>{
      const a = answered[q._key];
      if (a===undefined) return;
      const ok = q.kind==="essay" ? a==="correct"
             : q.kind==="multi" ? (Array.isArray(a) && a.length===(q.ansSet||[]).length && a.every(x=>(q.ansSet||[]).includes(x)))
             : a===q.ans;
      if (ok) c++; else w++;
    });
    // 오답 카운트: retry 중이면 캡처된 키 수 표시
    const wrongCount = retryKeys ? retryKeys.length : w;
    return { c, w, total:questions.length, done:c+w, wrongCount };
  }, [answered, questions, retryKeys]);

  const safeIdx = Math.min(idx, Math.max(filtered.length-1, 0));
  const curQ = filtered[safeIdx];
  const pct = questions.length ? (stats.done/stats.total)*100 : 0;

  return (
    <div style={{ padding:"16px", maxWidth:720, margin:"0 auto" }}>
      <div style={{ padding:"8px 0 14px", borderBottom:`1px solid ${C.border}` }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={onBack} style={{ background:"none",border:"none",color:C.text,fontSize:14,cursor:"pointer",padding:6,fontWeight:600 }}>← 목록</button>
          <span style={{ fontSize:16, fontWeight:800, color:C.gold }}>{title}</span>
          <span style={{ fontSize:13, color:C.dim, fontWeight:600 }}>{stats.done}/{stats.total}</span>
        </div>
        <div style={{ width:"100%", height:4, background:C.border, borderRadius:2, marginTop:12, overflow:"hidden" }}>
          <div style={{ width:`${pct}%`, height:"100%", background:`linear-gradient(90deg,${C.accent},${C.gold})`, borderRadius:2, transition:"width .4s" }}/>
        </div>
        <div style={{ display:"flex", justifyContent:"center", gap:22, marginTop:10, fontSize:14 }}>
          <span style={{ color:C.correct, fontWeight:700 }}>✓ {stats.c}</span>
          <span style={{ color:C.wrong, fontWeight:700 }}>✗ {stats.w}</span>
        </div>
        <div style={{ display:"flex", gap:6, marginTop:10, justifyContent:"center", flexWrap:"wrap" }}>
          {[["all","전체",questions.length],["wrong","오답 다시풀기",stats.wrongCount],["unanswered","미풀이",stats.total-stats.done]].map(([m,l,n])=>(
            <button key={m} onClick={()=>handleModeChange(m)} style={{ padding:"7px 14px", borderRadius:16, border:`1px solid ${mode===m?C.accent:C.border}`, background:mode===m?"#ff5a7333":"#0d1117", color:mode===m?C.text:C.text, fontSize:13, fontWeight:600, cursor:"pointer", outline:"none" }}>{l} <span style={{ color:mode===m?C.accent:C.subtle, fontWeight:700 }}>({n})</span></button>
          ))}
        </div>
        {mode==="wrong" && retryKeys && retryKeys.length>0 && (
          <div style={{ textAlign:"center", marginTop:10, fontSize:12, color:C.gold }}>🔄 오답을 다시 풀고 있어요 · 정답은 풀이 후 표시됩니다</div>
        )}
      </div>

      {filtered.length===0 ? (
        <div style={{ background:C.card, borderRadius:12, padding:30, marginTop:20, textAlign:"center", border:`1px solid ${C.border}` }}>
          <div style={{ fontSize:32, marginBottom:10 }}>{mode==="wrong"?"🎉":"✅"}</div>
          <div style={{ fontWeight:600, fontSize:14 }}>{mode==="wrong"?"오답이 없어요!":mode==="unanswered"?"안 푼 문제가 없어요":"문제가 없어요"}</div>
        </div>
      ) : (
        <>
          <QuestionCard key={curQ._key} q={curQ} answered={answered} onSelect={onSelect}/>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:18, gap:10 }}>
            <button disabled={safeIdx===0} onClick={()=>setIdx(safeIdx-1)} style={{ flex:1, padding:"13px", borderRadius:8, border:`1px solid ${C.border}`, background:safeIdx===0?"transparent":C.card, color:safeIdx===0?C.subtle:C.text, fontSize:14, fontWeight:700, cursor:safeIdx===0?"default":"pointer", outline:"none" }}>← 이전</button>
            <span style={{ fontSize:13, color:C.text, minWidth:56, textAlign:"center", fontWeight:700 }}>{safeIdx+1}/{filtered.length}</span>
            <button disabled={safeIdx>=filtered.length-1} onClick={()=>setIdx(safeIdx+1)} style={{ flex:1, padding:"13px", borderRadius:8, border:`1px solid ${C.border}`, background:safeIdx>=filtered.length-1?"transparent":C.card, color:safeIdx>=filtered.length-1?C.subtle:C.text, fontSize:14, fontWeight:700, cursor:safeIdx>=filtered.length-1?"default":"pointer", outline:"none" }}>다음 →</button>
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const exams = useMemo(() => ALL_EXAMS.map(e => ({ ...e, _qs:normalize(e) })), []);
  const allQuestions = useMemo(() => exams.flatMap(e=>e._qs), [exams]);

  const allTags = useMemo(() => {
    const counter = {};
    allQuestions.forEach(q => (q.tags||[]).forEach(t => { counter[t]=(counter[t]||0)+1; }));
    return Object.entries(counter).map(([tag,count])=>({tag,count})).sort((a,b)=>b.count-a.count);
  }, [allQuestions]);

  const [answered, setAnswered] = useState(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
    catch { return {}; }
  });
  const [examId, setExamId] = useState(null);
  const [tag, setTag] = useState(null);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answered)); } catch {}
  }, [answered]);

  const handleSelect = useCallback((key, val) => {
    setAnswered(p => ({ ...p, [key]:val }));
  }, []);

  const handleClearKeys = useCallback((keys) => {
    setAnswered(p => {
      const next = { ...p };
      keys.forEach(k => delete next[k]);
      return next;
    });
  }, []);

  const reset = () => {
    if (!confirm("정말 모든 풀이 기록을 삭제할까요?")) return;
    setAnswered({});
  };

  if (examId) {
    const e = exams.find(x => x.id===examId);
    return <QuizView title={e.title} questions={e._qs} examKind={e.kind} answered={answered} onSelect={handleSelect} onClearKeys={handleClearKeys} onBack={()=>setExamId(null)}/>;
  }
  if (tag) {
    const qs = allQuestions.filter(q => (q.tags||[]).includes(tag));
    return <QuizView title={`🏷️ ${tag}`} questions={qs} examKind="mixed" answered={answered} onSelect={handleSelect} onClearKeys={handleClearKeys} onBack={()=>setTag(null)}/>;
  }
  return <ExamHome exams={exams} allTags={allTags} answered={answered} onPickExam={setExamId} onPickTag={setTag} onReset={reset}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
